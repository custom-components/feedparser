name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Dependabot PRs are handled by claude-dependabot.yml; fork PRs get no secrets.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for this Home Assistant custom integration
            (Python, custom_components/feedparser). Focus on correctness,
            Home Assistant conventions (config flow, coordinators, async usage,
            no blocking I/O in the event loop), manifest/hacs.json consistency,
            error handling for malformed or unreachable feeds, and test coverage
            in tests/. Leave inline comments for specific issues and one short
            summary comment. Do not nitpick what pre-commit already covers.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
